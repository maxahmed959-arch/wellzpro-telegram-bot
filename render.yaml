# نشر مجاني — البوت يعمل 24/7 بدون فتح حاسوبك
# https://render.com — New + Blueprint أو ربط GitHub
services:
  - type: web
    name: wellzpro-telegram-bot
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_ENABLED
        value: "false"
      - key: TELEGRAM_ADMIN_PIN
        value: WellzPro2026
      - key: TELEGRAM_BANK_ACCOUNT
        value: "0547196179"
      - key: TELEGRAM_BANK_NAME
        value: urpay
      - key: TELEGRAM_ADMIN_IDS
        value: ""
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      # Firebase — مطلوب لتوليد أكواد التفعيل من البوت (/gen)
      # الصق محتوى service-account.json كاملاً في قيمة هذا المتغيّر
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: FIREBASE_DATABASE_URL
        value: https://samuraibot-acc00-7ea81-default-rtdb.firebaseio.com
      - key: RATE_LIMIT_PER_MINUTE
        value: "5"
      - key: AUTO_DELIVER_ON_PROOF
        value: "false"
      - key: EXPIRY_REMINDER_DAYS
        value: "3"
      - key: SUPER_ADMIN_PIN
        sync: false
      # اختياري — فيديو زر «طريقة التشغيل» (رابط mp4 أو file_id من /videoid)
      - key: HOW_TO_RUN_VIDEO_FILE_ID
        sync: false
      - key: HOW_TO_RUN_VIDEO_URL
        sync: false
      - key: APP_DOWNLOAD_GITHUB_REPO
        value: maxahmed959-arch/wellzpro-telegram-bot
      - key: APP_DOWNLOAD_RELEASE
        value: v1.0.0
